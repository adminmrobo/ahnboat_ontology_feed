<style>
:root{
  --bg:#ffffff; --paper:#fbfaf7; --ink:#1f2224; --muted:#5f6663; --line:#1f2224; --sun:#e0a92a;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:1760px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-left,0px)) 16px}
/* 헤드(top.html)·배웅(bottom.html)과 같은 점무늬 종이·테두리·그림자 */
.ban{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:stretch;min-height:270px;
  border:2px solid var(--line);border-radius:22px;overflow:hidden;color:inherit;text-decoration:none;
  background:radial-gradient(circle at 1px 1px,#e9e5dc 1px,transparent 1.5px) 0 0/18px 18px,var(--paper);
  box-shadow:6px 6px 0 var(--line);transition:transform .15s,box-shadow .15s}
.ban:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--line)}
.ban:focus-visible{outline:3px solid var(--sun);outline-offset:4px}
.ban.has-bg{background-size:cover;background-position:right 42%;image-rendering:pixelated}
.ban.has-bg .btext{background:linear-gradient(90deg,rgba(251,250,247,.94) 70%,rgba(251,250,247,0))}
.btext{position:relative;z-index:2;padding:28px 32px;align-self:center}
.kicker{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:#fff;margin:0 0 12px}
h2{margin:0;font-size:clamp(1.6rem,3.4vw,2.5rem);line-height:1.15;letter-spacing:-.01em}
.tag{margin:8px 0 0;font-size:1.02rem;color:var(--muted)}
.stat{margin:10px 0 0;font-family:var(--mono);font-size:.78rem;color:var(--ink)}
.who{margin:8px 0 0;font-size:.84rem;color:var(--muted)}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:.9rem;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:7px 16px;background:var(--sun);color:var(--ink);box-shadow:3px 3px 0 var(--line)}
.crew{position:relative;min-height:280px}
.crew .row{position:absolute;left:0;right:0;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.crew .back{bottom:70px}
.crew .front{bottom:2px;gap:28px}
.ban.has-bg .crew::after{display:none}
.crew::after{content:"";position:absolute;left:4%;right:4%;bottom:62px;height:12px;border-radius:50%;background:rgba(31,34,36,.08);z-index:0}
.spr{background-repeat:no-repeat;flex:none;image-rendering:pixelated;position:relative;z-index:1}
.fig{position:relative}
.zzz{position:absolute;left:60%;bottom:42px;font-weight:800;color:#6a4fb3;font-size:.8rem;pointer-events:none}
.zzz span{position:absolute;opacity:0;animation:zz 3s infinite}
.zzz span:nth-child(2){animation-delay:1s}.zzz span:nth-child(3){animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,8px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(16px,-30px) scale(1.2)}}
.clap{position:absolute;bottom:42%;right:-30px;font-family:var(--mono);font-size:.62rem;font-weight:700;color:#c0613a;animation:pop 1.2s infinite;white-space:nowrap}
@keyframes pop{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-5px);opacity:1}}
.say{position:absolute;top:12px;right:14px;max-width:min(330px,86%);background:#fff;border:2px solid var(--line);border-radius:14px 14px 4px 14px;padding:6px 12px;font-size:.82rem;box-shadow:3px 3px 0 var(--line);margin:0;z-index:3;transition:opacity .25s}
.say b{display:block;font-size:.68rem;color:var(--muted)}
@media (max-width:820px){
  .ban{grid-template-columns:minmax(0,1fr)}
  .btext{padding:22px 20px 6px}
  .ban.has-bg .btext{background:rgba(251,250,247,.9)}
  .crew{min-height:262px}
  .crew .back{bottom:54px}.crew::after{bottom:48px}
  .say{left:12px;right:auto;border-radius:14px 14px 14px 4px}
}
@media (prefers-reduced-motion:reduce){.zzz span,.clap{animation:none;opacity:1}.ban,.say{transition:none}}
</style>

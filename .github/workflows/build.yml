name: 온톨로지 피드 만들기

on:
  schedule:
    # 한 시간마다 원본(ahnboat_lab_cover_status)의 최신 커밋을 확인해,
    # 지난번에 만든 뒤로 바뀌었을 때만 실제로 만든다 (원본 수집이 끝나면 늦어도 한 시간 안에 반영).
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "원본이 안 바뀌어도 다시 만들기"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/**", "config/**", "assets/*.png", "assets/*.jpg", "assets/*.jpeg", ".github/workflows/build.yml"]

permissions:
  contents: write

concurrency:
  group: feed-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 원본(표지 현황)의 최신 커밋 확인
        id: src
        run: echo "sha=$(git ls-remote https://github.com/adminmrobo/ahnboat_lab_cover_status.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: 이 원본으로 이미 만들었는지 확인
        id: seen
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .feed_src
          key: feed-src-${{ steps.src.outputs.sha }}
          lookup-only: true

      - name: 만들 필요 판단
        id: go
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.seen.outputs.cache-hit }}" = "true" ]; then
            echo "원본이 그대로라 건너뜀"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.go.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.go.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: 확인한 바로 그 원본 커밋 받기 (raw 주소의 캐시 지연을 피한다)
        if: steps.go.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: adminmrobo/ahnboat_lab_cover_status
          ref: ${{ steps.src.outputs.sha }}
          path: _src
          sparse-checkout: data

      - name: 최신 온톨로지로 피드 만들기 (올린 표지·배경 그림은 WebP로)
        if: steps.go.outputs.run == 'true'
        run: |
          pip install --quiet pillow
          python scripts/build_feeds.py --src _src

      - name: 바뀐 것이 있으면 커밋
        if: steps.go.outputs.run == 'true'
        run: |
          git config user.name "adminmrobo"
          git config user.email "sangsun.ahn@gmail.com"
          git add feeds ontology config llms.txt assets
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "피드 갱신: $(python -c 'import json;print(json.load(open("feeds/index.json"))["updated"])')"
            for i in 1 2 3; do
              git push && break
              [ $i = 3 ] && exit 1
              git pull -q --rebase origin main || exit 1
              sleep $((i * 5))
            done
          fi

      - name: 이 원본으로 만들었다고 기록
        if: steps.go.outputs.run == 'true'
        run: mkdir -p .feed_src && echo "${{ steps.src.outputs.sha }}" > .feed_src/sha

      - uses: actions/cache/save@v4
        if: steps.go.outputs.run == 'true'
        with:
          path: .feed_src
          key: feed-src-${{ steps.src.outputs.sha }}

<!-- ahnboat.xyz 워드프레스 '사용자 정의 HTML' 블록에 그대로 붙여 넣는 바로가기 배너
     - 넣을 자리: 홈페이지 본문 중 원하는 곳 (예: 맨 아래 배웅 배너 바로 위)
     - 배너 페이지: https://adminmrobo.github.io/ahnboat_ontology_feed/banner.html
     - 언어: 홈페이지에서 고른 언어(ahnboat-lang)를 따라 7개 언어로 바뀝니다. 강제로 정하려면 src 끝에 ?lang=en 등을 붙입니다.
     - 높이: 배너가 자기 높이를 알려 주면 아래 짧은 스크립트가 블록 높이를 맞춥니다(스크롤 막대 방지).
       홈페이지에 이미 같은 메시지(ahnboat-catalog-height)를 받는 코드가 있으면 둘이 같은 값으로 맞추므로 문제없습니다. -->
<div class="ahn-idea-banner" style="max-width:100%;margin:0 auto;">
  <iframe id="ahn-idea-banner" src="https://adminmrobo.github.io/ahnboat_ontology_feed/banner.html"
          title="연구실 도구함 — 바로가기" loading="lazy"
          style="display:block;width:100%;height:320px;border:0;overflow:hidden;background:transparent;" scrolling="no"></iframe>
  <noscript><a href="https://adminmrobo.github.io/ahnboat_ontology_feed/">연구실 도구함 →</a></noscript>
</div>
<script>
(function(){
  var f = document.getElementById("ahn-idea-banner");
  if (!f) return;
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.type !== "ahnboat-catalog-height" || e.source !== f.contentWindow) return;
    var h = parseInt(d.height, 10);
    if (h > 80 && h < 2000) f.style.height = h + "px";
  });
})();
</script>
